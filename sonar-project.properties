# SonarCloud Configuration
# https://sonarcloud.io/project/overview?id=Brad-Edwards_aces-scenario-workbench

sonar.projectKey=Brad-Edwards_aces-scenario-workbench
sonar.organization=brad-edwards

# Make the scanner wait for the SonarCloud quality gate and fail the CI `sonar`
# job when the gate fails, so nothing merges past a failing gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/migrations/**,\
  **/dist/**,\
  **/build/**,\
  **/node_modules/**,\
  fixtures/**

# Generated / boilerplate code and static assets (no JS test runner) are
# excluded from coverage measurement.
sonar.coverage.exclusions=\
  **/migrations/**,\
  **/wsgi.py,\
  **/asgi.py,\
  **/settings.py,\
  **/static/**,\
  **/*.js

# Rule suppressions.
#
# The repository's enforced lint contract is Ruff (see pyproject.toml). These
# Sonar rules either conflict with that contract or do not fit the Django idiom,
# so they are suppressed here (mirroring the ACES SDL repository):
#   - S1720: docstrings on every class/function are not mandated by the contract.
#   - S1722: "inherit from object" is a Python 2 relic; Ruff (UP004) removes it.
#   - Web:InternationalizationCheck: this project uses Django's i18n framework
#     (gettext / {% trans %}), not Sonar's resource-bundle model.
#   - Web:MaxLineLengthCheck / Web:LongJavaScriptCheck: HTML template line width
#     and the small pre-paint theme script are not linted by the repo toolchain;
#     Django template tags make single-line width a poor signal.
#   - css:S4664 (descending specificity): fires on non-conflicting,
#     component-scoped descendant selectors here.
sonar.issue.ignore.multicriteria=d1,d2,d3,d4,d5,d6
sonar.issue.ignore.multicriteria.d1.ruleKey=python:S1720
sonar.issue.ignore.multicriteria.d1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.d2.ruleKey=python:S1722
sonar.issue.ignore.multicriteria.d2.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.d3.ruleKey=Web:InternationalizationCheck
sonar.issue.ignore.multicriteria.d3.resourceKey=**/*.html
sonar.issue.ignore.multicriteria.d4.ruleKey=Web:MaxLineLengthCheck
sonar.issue.ignore.multicriteria.d4.resourceKey=**/*.html
sonar.issue.ignore.multicriteria.d5.ruleKey=Web:LongJavaScriptCheck
sonar.issue.ignore.multicriteria.d5.resourceKey=**/*.html
sonar.issue.ignore.multicriteria.d6.ruleKey=css:S4664
sonar.issue.ignore.multicriteria.d6.resourceKey=**/*.css

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
