# SonarCloud Configuration
# https://sonarcloud.io/project/overview?id=Brad-Edwards_aces-scenario-workbench

sonar.projectKey=Brad-Edwards_aces-scenario-workbench
sonar.organization=brad-edwards

# Make the scanner wait for the SonarCloud quality gate and fail the CI `sonar`
# job when the gate fails, so nothing merges past a failing gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/migrations/**,\
  **/dist/**,\
  **/build/**,\
  **/node_modules/**,\
  fixtures/**

# Generated / boilerplate code is excluded from coverage measurement.
sonar.coverage.exclusions=\
  **/migrations/**,\
  **/wsgi.py,\
  **/asgi.py,\
  **/settings.py

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
