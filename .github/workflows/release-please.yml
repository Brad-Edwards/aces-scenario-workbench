name: Release Please

# release-please owns versioning + CHANGELOG.md. On each push to `main` it
# maintains a release PR ("chore(main): release X.Y.Z") that bumps
# [project].version and CHANGELOG.md from the Conventional Commit history.
# Merging that PR tags vX.Y.Z and cuts the GitHub Release; the publish job then
# builds the wheel/sdist and publishes to PyPI over OIDC trusted publishing, and
# the docker job builds and pushes the container image to GHCR.
# Feature PRs never touch CHANGELOG.md.
#
# The release PR is opened by GITHUB_TOKEN, so required CI checks do not auto-run
# on it — admin-merge it (or give release-please a PAT so its checks run). The
# main -> dev back-merge is handled by sync-main-to-dev.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # attach the built distributions to the GitHub Release
      id-token: write   # OIDC trusted publishing to PyPI (no stored token)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
      - name: Build sdist + wheel
        run: uv build --out-dir dist
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
      - name: Attach the distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" dist/* --clobber

  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to GHCR under this repository's owner
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the container image
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/aces-workbench"
          docker build -t "${image}:${version}" -t "${image}:latest" .
          docker push "${image}:${version}"
          docker push "${image}:latest"
