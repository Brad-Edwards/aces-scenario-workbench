{% extends "workbench/base.html" %}

{% block title %}Reset password — ACES Scenario Workbench{% endblock %}

{% block content %}
  <h1>Reset your password</h1>
  <p>Enter your email address and we will send a link to reset your password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
  </form>
{% endblock %}
